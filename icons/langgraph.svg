<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="48" height="48" rx="10" fill="#FFFFFF"/>
  
  <!-- Central State Machine Node -->
  <rect x="14" y="14" width="16" height="20" rx="3" stroke="#1C1C1E" stroke-width="2.5" fill="none"/>
  <path d="M 14 22 L 30 22" stroke="#1C1C1E" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 18 28 L 26 28" stroke="#1C1C1E" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Cyclical Agentic Loop -->
  <path d="M 30 28 C 41 28, 41 16, 31 16" stroke="#1C1C1E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Arrow Head pointing back into the node -->
  <polygon points="30,16 35,13 35,19" fill="#1C1C1E"/>
</svg>
